<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>เอกสารของฉัน · นากนะ</title><link rel="stylesheet" href="/documents.css"></head><body><main><header><img src="/logo.png" alt="นากนะ"><div><b>เอกสารของฉัน</b><span id="who">กำลังโหลด…</span></div></header><section id="caseList" class="list"></section><section id="list" class="list"></section></main><dialog id="ack"><form method="dialog"><h3>รับทราบเอกสาร</h3><p>การกดรับทราบหมายถึงคุณได้รับและเห็นเอกสารนี้ ไม่ได้หมายความว่าคุณยอมรับข้อกล่าวหาหรือสละสิทธิ์ในการชี้แจง</p><textarea id="response" placeholder="คำชี้แจง (ไม่บังคับ)"></textarea><p id="ackError" class="inline-error" role="alert"></p><div class="actions"><button value="cancel" class="ghost">ยกเลิก</button><button id="ackBtn" value="default" type="button">ยืนยันการรับทราบ</button></div></form></dialog><dialog id="caseResponse"><form method="dialog"><h3>คำชี้แจงของคุณ</h3><p>ข้อความนี้จะถูกเก็บเป็นส่วนหนึ่งของ Timeline ของเรื่องนี้ เพื่อให้ทั้งคุณและบริษัทมีหลักฐานตรงกัน</p><textarea id="caseResponseText" placeholder="อธิบายเหตุการณ์หรือข้อมูลที่ต้องการชี้แจง"></textarea><p id="caseError" class="inline-error" role="alert"></p><div class="actions"><button value="cancel" class="ghost">ยกเลิก</button><button id="caseResponseBtn" value="default" type="button">ส่งคำชี้แจง</button></div></form></dialog><script src="/documents.js"></script></body></html>
