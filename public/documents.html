<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>เอกสารของฉัน · นากนะ</title><link rel="stylesheet" href="/documents.css?v=P8.26.0"></head><body><main><header><img src="/logo.png" alt="นากนะ"><div><b>เอกสารของฉัน</b><span id="who">กำลังโหลด…</span></div></header><section id="list" class="list"></section></main><dialog id="ack"><form method="dialog"><div class="ack-head"><div><small id="ackEyebrow">DOCUMENT SIGNATURE</small><h3 id="ackTitle">ลงลายเซ็นเอกสาร</h3></div><button value="cancel" class="icon-close" aria-label="ปิด">×</button></div><p id="ackIntro">ตรวจสอบเอกสารที่ HR ลงนามแล้วก่อนลงลายเซ็นของคุณ</p><div id="ackDocumentMeta" class="ack-document-meta"></div><div class="signature-field"><div class="signature-field-head"><label id="ackSignatureLabel">ลายเซ็นพนักงาน</label><button id="clearSignature" type="button">ล้างลายเซ็น</button></div><canvas id="signaturePad" aria-label="พื้นที่ลงลายเซ็น"></canvas><small>ใช้นิ้วหรือเมาส์ลงลายเซ็นในกรอบ</small></div><label class="ack-confirm"><input id="ackConfirm" type="checkbox"> <span id="ackConfirmText">ข้าพเจ้าได้รับ อ่าน และตรวจสอบเอกสารฉบับนี้แล้ว</span></label><label class="response-label" for="response">คำชี้แจงเพิ่มเติม <small>(ไม่บังคับ)</small></label><textarea id="response" placeholder="หากมีข้อเท็จจริงหรือคำชี้แจง สามารถระบุไว้พร้อมหลักฐานการลงนามได้"></textarea><p id="ackError" class="inline-error" role="alert"></p><div class="ack-evidence-note"><strong>หลักฐานที่จะถูกบันทึก</strong><span>ลายเซ็น HR · ลายเซ็นพนักงาน · ชื่อผู้ลงนาม · วันเวลา · Version เอกสาร · Final PDF</span></div><div class="actions"><button value="cancel" class="ghost">ยกเลิก</button><button id="ackBtn" value="default" type="button">ลงนามและสร้าง Final PDF</button></div></form></dialog><script src="/documents.js?v=P8.26.0"></script></body></html>
